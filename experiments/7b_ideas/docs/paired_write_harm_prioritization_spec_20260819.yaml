schema_version: paired-write-harm-prioritization-v2
status: frozen_secondary_after_shapeA_v8_pass
claim_name: myopic eligible-write actionability under a fixed shared-suffix protocol
prerequisites: {shapeA_v8_all_core_gates: pass, exact_factual_noop_shared_suffix: pass, branch_closure: 1.0}
decision_key: [stable_example_id, write_id]
target_population: uniform_example_then_uniform_prefrozen_eligible_write
weight:
  row: 1/eligible_write_count
  example_total: 1
  postbranch_missing_reallocated: false
  applies_to: [arm_means, best_constant, rowwise_oracle, myopic_value, gain, opportunity, regret, harm_mass, benefit_mass, coverage]
independent_unit: stable_example_id
bootstrap: {unit: stable_example_id, retain_all_writes: true, row_bootstrap: false}
curve:
  tie_break: outcome_blind_sha256_of_composite_example_write_key
  q_axis: cumulative_eligible_weight_not_row_count
  AUPHC: integrate_adjacent_eligible_weight_intervals
  choose_best_q_on_confirmation: false
closure:
  eligible_write_count_matches_prefrozen_rows: required
  complete_and_pair_qualified_fraction: 1.0
  complete_case_or_weight_renormalization: forbidden
forbidden: [one_example_one_row_contract, per_write_IID, row_bootstrap, sequential_gate_or_policy_value, closed_loop_value_from_single_write_potential_outcomes, average_within_example_before_rowwise_oracle]
execution: {adds_rollout: false, adds_training: false, training_authorized: false}
gate_ledger: {schema: paired_write_harm_gate.schema.json, never_unlocks_training: true}
denominator_scope:
  identified: uniform_example_then_uniform_R1_eligible_write
  required_probability_names: [eligible_target_harmful_commit_probability, eligible_target_beneficial_rejection_probability]
  raw_pool_probability_identified: false
  raw_target_weight: 1/m_i^target
  raw_target_includes: [R0, construct_failure, unpaired_rows]
  complete_attrition_ledger_event_bound: "[M_obs/N_raw,(M_obs+M_miss)/N_raw]"
  raw_policy_value_without_frozen_R0_fallback: undefined
  violation: RAW_POOL_DENOMINATOR_FALSE_CLAIM
