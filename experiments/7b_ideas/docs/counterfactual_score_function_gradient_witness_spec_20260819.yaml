schema_version: counterfactual-gradient-witness-v8
authorization: {w4_claim: false, training: false, gradient_pilot: false, optimizer_step: false, algorithm_novelty: false}
defaults: {optimizer_steps: 0, new_rollouts: false, policy_derivative_mode: L_frozen_future_policy}
endpoint_parity:
  required_dimensions: [horizon, future_policy, suffix_contract, reader, answer_cell, answer_normalization, reward_components, reward_weights, reward_scale, invalid_rule, truncation_rule, missing_rule, row_weights, candidate_joinability, score_mask_joinability]
  missing_or_unknown: ENDPOINT_TARGET_AMBIGUOUS
  all_equal_mode: CV_same_endpoint
  any_difference_mode: OM_distinct_endpoint
CV_same_endpoint:
  exact_noop_role: control_variate_not_new_action_value_target
  including_self_expected_scale: (n-1)/n
  debias_factor: n/(n-1)
  debiased_all_mean_equals_loo_per_batch: true
  theoretical_null: E_group[G_credit_debiased-G_CF]=0
  primary_outputs: [paired_cross_group_mean, paired_cross_group_variance]
  MSE_requires: independent_many_action_or_replication_reference
  stable_nonzero_mean_diagnoses: [endpoint_parity, IID, baseline_independence, selection, score_mask, loss_reconstruction]
OM_distinct_endpoint:
  legal_name: surrogate_objective_gradient_mismatch
  forbidden_name: same_reward_credit_estimator_loss
  RED_pass_required: true
  outputs: [G_eval_minus_G_train_cluster_interval, endpoint_label_shuffle_null, equal_scale_component_ablation]
  exact_noop_repairs_mismatch: false
policy_derivative:
  node_ledger_fields: [role, checkpoint, parameter_identity, shares_theta, semantics, token_span_and_EOS, mask_hash, actual_included, reference_included, arm_parity, stopgrad]
  actual_reference_node_sets_match: required
  L_frozen_future_policy:
    future_nodes: frozen_pi_bar_stop_gradient
    legal_label: frozen_future_local_writer_gradient
    current_score_includes_EOS_stop: true
  T_tied_recurrent_policy:
    complete_theta_nodes_label: full_terminal_recurrent_policy_gradient
    current_only_label: local_recurrent_semi_gradient
    current_only_full_gradient_claim: false
gradient_geometry:
  raw_euclidean_full_sketch_rademacher:
    role: fixed_coordinate_secondary_diagnostic_only
    invertible_reparameterization_invariant: false
    method_unlock: false
  default: none_no_direction_adjudication
  selection_time: before_endpoint_unblinding
  Fisher_tested_subspace:
    required: [parameter_block_hash, projection_hash, effective_rank, condition_number, relative_damping, eigen_cutoff, sensitivity_manifest_hash]
    legal_claim: empirical_Fisher_tested_subspace_geometry
  optimizer_delivery:
    reconstruction: [Adam_moments, learning_rate, clip, weight_decay, accumulation, scaling]
    state_mutation: false
    output: g_endpoint_dot_DeltaTheta_actual
    legal_claim: optimizer_delivery_evidence_not_pure_credit
  coordinate_scale_artifact: euclidean_opposed_but_Fisher_or_delivery_not_opposed
  delivery_conflict: not_automatic_credit_failure
forbidden_evidence: [single_batch_alignment, captured_signed_ratio, silent_mass, opposed_mass, nonzero_gradient_norm, nonzero_gradient_rate, gradient_difference_norm, scalar_advantage_sign, single_parameter_delta, parameterization_invariant_raw_euclidean_cosine]
sample_size: {pilot_independent_groups: 4, scientific_minimum_independent_groups: 20}
failure: {status: W4_NO_GO, highest_level: W3}
